name: Build AutoKontrole APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4

      - name: Install Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Extract project
        run: |
          mkdir project
          unzip -o *.zip -d project

      - name: Build APK
        run: gradle -p project --no-daemon :app:assembleDebug

      - uses: actions/upload-artifact@v4
        with:
          name: AutoKontrole-APK
          path: project/app/build/outputs/apk/debug/app-debug.apk
