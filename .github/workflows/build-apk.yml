
name: Build AutoKontrole APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Extract project
        run: |
          mkdir -p project
          unzip -o "AutoKontrole-Android-v0.9.0-paspaudziami-filtrai.zip" -d project

      - name: Fix Java and Kotlin versions
        run: |
          python3 - <<'PY'
          p = "project/app/build.gradle.kts"
          s = open(p).read()
          s = s.replace(
              "android {",
              """android {
              compileOptions {
                  sourceCompatibility = JavaVersion.VERSION_17
                  targetCompatibility = JavaVersion.VERSION_17
              }
              kotlinOptions {
                  jvmTarget = "17"
              }""",
              1
          )
          open(p, "w").write(s)
          PY

      - name: Build APK
        run: gradle -p project --no-daemon :app:assembleDebug

      - uses: actions/upload-artifact@v4
        with:
          name: AutoKontrole-APK
          path: project/app/build/outputs/apk/debug/app-debug.apk
